<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SolarSim — real-scale 3D solar system</title>
    <meta name="description" content="A real-scale, real-ephemeris 3D simulator of the Sol system. Fly the planets, moons, comets and spacecraft at their true positions for any date, plan orbital transfers, and watch the sky from any point on Earth." />
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SolarSim" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%2305070a'/%3E%3Cellipse%20cx='16'%20cy='16'%20rx='13'%20ry='6.5'%20fill='none'%20stroke='%235fe0ef'%20stroke-width='1.4'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='4.2'%20fill='%23ffab3d'/%3E%3Ccircle%20cx='29'%20cy='16'%20r='1.7'%20fill='%235fe0ef'/%3E%3C/svg%3E" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SolarSim" />
    <meta property="og:description" content="A real-scale, real-ephemeris 3D simulator of the Sol system — planets, moons, comets and spacecraft at their true positions for any date." />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Boot splash: inline so it paints instantly, before the CSS/JS bundle or the
         15 MB ephemeris arrive. main.ts removes #boot once the first frame is live. */
      html, body { margin: 0; height: 100%; background: #05070a; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; background: #05070a;
        color: #ffab3d; font: 600 15px/1.4 ui-monospace, 'JetBrains Mono', monospace;
        letter-spacing: 0.35em; transition: opacity 0.5s ease; text-transform: uppercase;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .ring { width: 46px; height: 46px; border: 2px solid rgba(95, 224, 239, 0.25); border-top-color: #5fe0ef; border-radius: 50%; animation: bootspin 0.9s linear infinite; }
      #boot .sub { color: #7a8794; font-size: 11px; letter-spacing: 0.2em; text-transform: none; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div class="ring"></div>
      <div>SolarSim</div>
      <div class="sub" id="boot-sub">initialising ephemeris…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
