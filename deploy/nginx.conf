# Two servers: plain http on :80 (the Cloudflare tunnel origin — the browser
# sees https at the edge, so the app is cross-origin isolated there) and
# self-signed https on :443 for secure-context LAN preview.
#
# COOP/COEP are required for SharedArrayBuffer (the P1+ sim core). They are set
# at server scope; locations that add their own Cache-Control must restate them,
# because nginx add_header does not inherit once a location adds any header.

map $uri $immutable {
    default              "no-cache";
    ~^/assets/           "public, max-age=31536000, immutable";
    # Data + textures have content-stable filenames (rebaked on redeploy); cache a
    # week so repeat visits don't revalidate ~33 MB. Set via the server-scope
    # add_header below, so COOP/COEP are preserved (no per-location header reset).
    ~^/(data|textures)/  "public, max-age=604800";
}

# Compress the text assets (the 1 MB JS gzips to ~288 KB); binaries/JPEGs skip.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/javascript text/css text/plain application/json image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cache-Control $immutable always;

    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cache-Control $immutable always;

    location / { try_files $uri $uri/ /index.html; }
}
